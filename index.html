<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Industrial Map</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="app">

        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <aside class="left-menu" id="leftMenu">
            <!-- Панель управления панелью -->
            <div class="menu-resizer">
                <button class="btn-icon" id="collapseMenuBtn" title="Свернуть меню">«</button>
                <button class="btn-icon" id="expandMenuBtn" title="Развернуть меню" style="display:none;">»</button>
                <div class="resize-handle" id="resizeHandle" title="Потяните, чтобы изменить ширину"></div>
            </div>

            <div class="menu-toolbar">
                <button class="btn" id="layersBtn">Слои</button>
                <button class="btn btn-primary" id="addLegendBtn">+ Добавить</button>
                <button class="btn" id="logoutBtn">Выйти</button>
            </div>

            <!-- Кнопки отмены/возврата -->
            <div class="history-toolbar">
                <button class="btn-icon" id="undoBtn" title="Отменить одно действие">⟲</button>
                <button class="btn-icon" id="undoAllBtn" title="Отменить все действия">⟲⟲</button>
                <button class="btn-icon" id="redoBtn" title="Вернуть одно действие">⟳</button>
                <button class="btn-icon" id="redoAllBtn" title="Вернуть все действия">⟳⟳</button>
            </div>

            <div class="menu-content" id="menuContent"></div>
        </aside>

        <!-- ОСНОВНАЯ ОБЛАСТЬ КАРТЫ -->
        <div class="map-shell">
            <div class="map-stage" id="mapStage">
                <svg id="mapSvg" viewBox="0 0 2048 1290" preserveAspectRatio="xMidYMid meet" aria-label="Industrial Map">
                    <image id="baseMapImage" href="assets/map-base.png" x="0" y="0" width="2048" height="1290"></image>
                    <g id="workshopLayer"></g>
                    <g id="legendLayer"></g>

                    <!-- Элементы координатной сетки -->
                    <line id="coordsCrossX" x1="0" y1="0" x2="2048" y2="0" stroke="red" stroke-width="1" stroke-dasharray="5,5" style="opacity:0; pointer-events:none;"></line>
                    <line id="coordsCrossY" x1="0" y1="0" x2="0" y2="1290" stroke="red" stroke-width="1" stroke-dasharray="5,5" style="opacity:0; pointer-events:none;"></line>
                </svg>

                <div id="coordsDisplay" style="position:absolute; background:rgba(255,255,255,0.9); border:1px solid #ccc; padding:4px 8px; border-radius:4px; font-size:12px; pointer-events:none; opacity:0; z-index:300;">X: 0.0 | Y: 0.0</div>
            </div>
        </div>

        <!-- ПОИСК, КНОПКА РЕДАКТИРОВАНИЯ И КООРДИНАТЫ (Правый нижний угол) -->
        <div class="search-overlay">
            <button class="btn-icon" id="editModeBtn" title="Режим редактирования">
                <svg id="lockIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <svg id="unlockIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
            </button>

            <button class="btn-icon" id="coordsBtn" title="Показать/скрыть координаты">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="2" x2="12" y2="22"></line>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
                </svg>
            </button>

            <input id="searchInput" type="search" placeholder="Найти...">
            <button class="btn" id="clearSearchBtn" type="button">✕</button>
        </div>

        <!-- ЗУМ (Правый верхний угол) -->
        <div class="zoom-control">
            <button class="btn" id="zoomInBtn">+</button>
            <input id="zoomLevelInput" type="number" value="1" step="0.1" min="0.1" max="5">
            <button class="btn" id="zoomOutBtn">-</button>
            <button class="btn" id="zoomResetBtn">1:1</button>
        </div>

        <div id="toast" class="toast hidden"></div>
    </div>

    <!-- ВАЖНО: Правильный порядок скриптов и правильный путь к map-data.js -->
    <script src="js/config.js"></script>
    <script src="map/map-data.js"></script>
    <script src="js/api.js"></script>

    <!--
        xlsx-js-style нужен для записи XLSX с форматированием ячеек:
        шрифт, заливки и границы.
    -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
